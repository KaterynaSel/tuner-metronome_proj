<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="description" content="Guitar tuner and metronome — Mus Tools" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
  <title>Mus Tools</title>
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <h1 class="site-title">Mus Tools</h1>
      <nav class="site-nav" aria-label="Tools">
        <button type="button" class="nav-btn active" data-panel="tuner">Tuner</button>
        <button type="button" class="nav-btn" data-panel="metronome">Metronome</button>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <section id="panel-tuner" class="panel" aria-label="Tuner">
      <div class="tuner-display">
        <div class="tuner-gauge" aria-hidden="true">
          <div class="tuner-gauge__scale"></div>
          <div id="tuner-needle" class="tuner-gauge__needle"></div>
        </div>
        <p class="tuner-cents"><span id="tuner-cents">--</span> ¢</p>
        <p class="tuner-note" id="tuner-active-string">Play a string</p>
        <div class="tuner-mode" role="group" aria-label="String detection mode">
          <button type="button" class="tuner-mode-btn active" id="tuner-mode-auto" data-mode="auto">Auto</button>
          <button type="button" class="tuner-mode-btn" id="tuner-mode-manual" data-mode="manual">Manual</button>
        </div>
      </div>

      <div class="string-list" id="string-list">
        <article class="string-row" data-string="1">
          <div class="string-row__head">
            <label class="string-row__select">
              <input type="checkbox" class="string-select-cb" data-string="1" aria-label="Select string 1 E4" />
              <span class="string-row__select-mark" aria-hidden="true"></span>
            </label>
            <span class="string-row__label">1 · E4</span>
            <button type="button" class="btn btn--ghost string-btn" data-sound="/audio/string-1-e4.mp3">♪</button>
          </div>
          <div class="string-row__values">
            <span><strong id="hz-string1">--</strong> Hz</span>
            <span id="diff-string1">--</span>
          </div>
        </article>
        <article class="string-row" data-string="2">
          <div class="string-row__head">
            <label class="string-row__select">
              <input type="checkbox" class="string-select-cb" data-string="2" aria-label="Select string 2 B3" />
              <span class="string-row__select-mark" aria-hidden="true"></span>
            </label>
            <span class="string-row__label">2 · B3</span>
            <button type="button" class="btn btn--ghost string-btn" data-sound="/audio/string-2-b3.mp3">♪</button>
          </div>
          <div class="string-row__values">
            <span><strong id="hz-string2">--</strong> Hz</span>
            <span id="diff-string2">--</span>
          </div>
        </article>
        <article class="string-row" data-string="3">
          <div class="string-row__head">
            <label class="string-row__select">
              <input type="checkbox" class="string-select-cb" data-string="3" aria-label="Select string 3 G3" />
              <span class="string-row__select-mark" aria-hidden="true"></span>
            </label>
            <span class="string-row__label">3 · G3</span>
            <button type="button" class="btn btn--ghost string-btn" data-sound="/audio/string-3-g3.mp3">♪</button>
          </div>
          <div class="string-row__values">
            <span><strong id="hz-string3">--</strong> Hz</span>
            <span id="diff-string3">--</span>
          </div>
        </article>
        <article class="string-row" data-string="4">
          <div class="string-row__head">
            <label class="string-row__select">
              <input type="checkbox" class="string-select-cb" data-string="4" aria-label="Select string 4 D3" />
              <span class="string-row__select-mark" aria-hidden="true"></span>
            </label>
            <span class="string-row__label">4 · D3</span>
            <button type="button" class="btn btn--ghost string-btn" data-sound="/audio/string-4-d3.mp3">♪</button>
          </div>
          <div class="string-row__values">
            <span><strong id="hz-string4">--</strong> Hz</span>
            <span id="diff-string4">--</span>
          </div>
        </article>
        <article class="string-row" data-string="5">
          <div class="string-row__head">
            <label class="string-row__select">
              <input type="checkbox" class="string-select-cb" data-string="5" aria-label="Select string 5 A2" />
              <span class="string-row__select-mark" aria-hidden="true"></span>
            </label>
            <span class="string-row__label">5 · A2</span>
            <button type="button" class="btn btn--ghost string-btn" data-sound="/audio/string-5-a2.mp3">♪</button>
          </div>
          <div class="string-row__values">
            <span><strong id="hz-string5">--</strong> Hz</span>
            <span id="diff-string5">--</span>
          </div>
        </article>
        <article class="string-row" data-string="6">
          <div class="string-row__head">
            <label class="string-row__select">
              <input type="checkbox" class="string-select-cb" data-string="6" aria-label="Select string 6 E2" />
              <span class="string-row__select-mark" aria-hidden="true"></span>
            </label>
            <span class="string-row__label">6 · E2</span>
            <button type="button" class="btn btn--ghost string-btn" data-sound="/audio/string-6-e2.mp3">♪</button>
          </div>
          <div class="string-row__values">
            <span><strong id="hz-string6">--</strong> Hz</span>
            <span id="diff-string6">--</span>
          </div>
        </article>
      </div>
    </section>

    <section id="panel-metronome" class="panel" hidden aria-label="Metronome">
      <div class="metro-card">
        <p class="metro-bpm-display"><span id="metroBpmDisplay">120</span> BPM</p>

        <div class="metro-field">
          <label for="bpmInput">Tempo</label>
          <input type="number" id="bpmInput" min="40" max="240" value="120" />
        </div>

        <input type="range" id="bpmSlider" min="40" max="240" value="120" aria-label="Tempo slider" />

        <div class="metro-actions">
          <button type="button" class="btn btn--primary" id="startBtn">Start</button>
          <button type="button" class="btn btn--danger" id="stopBtn">Stop</button>
        </div>

        <select id="timeSelect" class="metro-select" aria-label="Time signature">
          <option value="2/4">2/4</option>
          <option value="3/4">3/4</option>
          <option value="4/4" selected>4/4</option>
          <option value="6/8">6/8</option>
        </select>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Guitar tuner &amp; metronome</p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>

</html>
